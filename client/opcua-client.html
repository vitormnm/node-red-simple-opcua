<script type="text/html" data-template-name="opcua-client">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="opcua-client">
    </div>
    <div class="form-row">
        <label for="node-input-connection"><i class="fa fa-server"></i> Connection</label>
        <input type="text" id="node-input-connection">
    </div>
    <div class="form-row">
        <label for="node-input-mode"><i class="fa fa-exchange"></i> Mode</label>
        <select id="node-input-mode">
            <option value="read">Read</option>
            <option value="readHistory">Read History</option>
            <option value="write">Write</option>
            <option value="browse">Browse</option>
            <option value="browseRecursive">Browse Recursive</option>
            <option value="method">Method</option>
              <option value="getSubscriptionId">getSubscriptionId</option>
            <option value="subscription">Subscription</option>
             <option value="events">Events</option>
        </select>
    </div>

    <div class="form-row opcua-client-recursive-row" style="display:none;">
        <label for="node-input-readValuesRecursive" style="width: auto; margin-right: 10px;">
            <i class="fa fa-eye"></i> Read tag values recursively
        </label>
        <input type="checkbox" id="node-input-readValuesRecursive" style="width: auto; margin: 0; vertical-align: middle;">
    </div>

    <div class="form-row opcua-client-selection-row">
        <label for="node-input-selectedItems"><i class="fa fa-code"></i> JSON</label>
        <input type="text" id="node-input-selectedItems" class="opcua-client-json" style="width: 70%;">
    </div>
    <div id="node-input-browse-modal" class="opcua-tree-modal" style="display:none;">
        <div class="opcua-tree-modal__dialog">
            <div class="opcua-tree-modal__header">
                <div class="opcua-tree-modal__title"><i class="fa fa-sitemap"></i> OPC UA Browse Tree</div>
                <a href="#" id="node-input-close-browse-modal" class="editor-button editor-button-small"><i class="fa fa-times"></i> Close</a>
            </div>
            <div class="opcua-tree-modal__toolbar">
                <a href="#" id="node-input-browse-root" class="editor-button editor-button-small"><i class="fa fa-search"></i> Browse Root</a>
                <div class="opcua-tree-search">
                    <i class="fa fa-search"></i>
                    <input type="text" id="node-input-browse-search" placeholder="Search for items already explored">
                    <a href="#" id="node-input-browse-search-clear" class="editor-button editor-button-small" style="display:none;"><i class="fa fa-times"></i></a>
                </div>
            </div>
            <div class="opcua-tree-modal__body">
                <div id="node-input-browse-tree" class="opcua-tree-editor"></div>
            </div>
        </div>
        <div id="node-input-browse-context-menu" class="opcua-tree-context-menu" style="display:none;">
            <a href="#" id="node-input-browse-context-refresh"><i class="fa fa-refresh"></i> Refresh node</a>
            <a href="#" id="node-input-browse-context-copy-nodeid"><i class="fa fa-copy"></i> Copy NodeID</a>
            <a href="#" id="node-input-browse-context-read-value"><i class="fa fa-eye"></i> Read value</a>
        </div>
    </div>

    <div class="form-row opcua-client-selection-row">
        <label style="width:auto;"><i class="fa fa-sitemap"></i> Browse Tree</label>
        <a href="#" id="node-input-open-browse-modal" class="editor-button">
            <i class="fa fa-expand"></i> Open browse tree
        </a>
    </div>

    <div class="form-row opcua-client-subscription-row">
        <label for="node-input-samplingInterval"><i class="fa fa-clock-o"></i> Sampling</label>
        <input type="text" id="node-input-samplingInterval" placeholder="250">
    </div>
    <div class="form-row opcua-client-subscription-row">
        <label for="node-input-publishingInterval"><i class="fa fa-clock-o"></i> Publishing</label>
        <input type="text" id="node-input-publishingInterval" placeholder="250">
    </div>
    <div class="form-row opcua-client-subscription-row">
        <label for="node-input-subscriptionMode"><i class="fa fa-sliders"></i> Sub. Mode</label>
        <select id="node-input-subscriptionMode" style="width:70%;">
            <option value="replace">Replace tags (keep only current)</option>
            <option value="append">Append tags (add to list)</option>
        </select>
    </div>
    <div class="form-row opcua-client-history-row" style="display:none;">
        <label for="node-input-historyStartTime"><i class="fa fa-clock-o"></i> Start Time</label>
        <input type="text" id="node-input-historyStartTime" style="width:70%;">
        <input type="hidden" id="node-input-historyStartTimeType">
    </div>
    <div class="form-row opcua-client-history-row" style="display:none;">
        <label for="node-input-historyEndTime"><i class="fa fa-clock-o"></i> End Time</label>
        <input type="text" id="node-input-historyEndTime" style="width:70%;">
        <input type="hidden" id="node-input-historyEndTimeType">
    </div>

    <div class="form-row opcua-client-selection-row" style="margin-bottom:0;">
        <label style="width:auto;"><i class="fa fa-tags"></i> Selected items</label>
    </div>
    <div class="form-row opcua-client-selection-row">
        <label style="width:auto;"></label>
        <div id="node-input-selected-tags" class="opcua-client-tag-box"></div>
    </div>

</script>

<script type="text/html" data-help-name="opcua-client">
    <div class="opcua-help-container">
        <p>OPC UA client node for read, write, browse, and subscription operations using a shared client configuration node.</p>

        <details class="opcua-help-section" open>
            <summary>Modes Info</summary>

            <!-- Read Mode -->
            <details class="opcua-help-card">
                <summary><i class="fa fa-book"></i> Read Mode</summary>
                <div class="opcua-help-content">
                    <p>Reads one or more variable values from the OPC UA server.</p>
                    <p><strong>Input (msg.payload):</strong> Pass an array of objects to read multiple tags. If empty or not an array, reads the nodes configured in the editor list:</p>
                    <pre><code>[
  {
    "name": "speed",
    "nodeID": "ns=2;s=Factory.Line1.Motor1.speed"
  }
]</code></pre>
                    <p><strong>Output (msg.payload):</strong> Array of read result objects:</p>
                    <pre><code>[
  {
    "name": "speed",
    "nodeID": "ns=2;s=Factory.Line1.Motor1.speed",
    "value": 45.2,
    "type": "Float",
    "status": "Good",
    "sourceTimestamp": "2026-06-30T11:30:00.000Z",
    "serverTimestamp": "2026-06-30T11:30:00.000Z"
  }
]</code></pre>
                </div>
            </details>
            
            <!-- Read History Mode -->
            <details class="opcua-help-card">
                <summary><i class="fa fa-history"></i> Read History Mode</summary>
                <div class="opcua-help-content">
                    <p>Reads historical variable values from the OPC UA server (HDA).</p>
                    <p><strong>Input Parameters:</strong> Specify the time range and parameters (optionally on <code>msg</code> or <code>msg.payload</code>):</p>
                    <ul>
                        <li><code>startTime</code>: Start timestamp (ISO string/Date, default 1 hour ago)</li>
                        <li><code>endTime</code>: End timestamp (ISO string/Date, default now)</li>
                        <li><code>numValuesPerNode</code>: Limit number of values (optional)</li>
                        <li><code>returnBounds</code>: Include boundaries values (optional)</li>
                    </ul>
                    <p><strong>Input (msg.payload):</strong> List of nodes to read history for. You can also specify an optional base64 <code>continuationPoint</code> per node to resume a previous query:</p>
                    <pre><code>[
  {
    "nodeID": "ns=2;s=Factory.Line1.Motor1.speed",
    "continuationPoint": "opaqueBase64String" // optional
  }
]</code></pre>
                    <p><strong>Output (msg.payload):</strong> Array of history result objects containing data points and any continuation points:</p>
                    <pre><code>[
  {
    "name": "speed",
    "nodeID": "ns=2;s=Factory.Line1.Motor1.speed",
    "status": "Good",
    "continuationPoint": "opaqueBase64String", // present if there are more values on server
    "history": [
      {
        "value": 42.0,
        "type": "Float",
        "status": "Good",
        "sourceTimestamp": "2026-07-10T10:00:00.000Z",
        "serverTimestamp": "2026-07-10T10:00:00.000Z"
      }
    ]
  }
]</code></pre>
                </div>
            </details>

            <!-- Write Mode -->
            <details class="opcua-help-card">
                <summary><i class="fa fa-pencil-square-o"></i> Write Mode</summary>
                <div class="opcua-help-content">
                    <p>Writes one or more tag values to the server.</p>
                    <p><strong>Input (msg.payload):</strong> Pass an array of objects to write multiple tags, a single object to write a single tag, or a raw scalar value (if configured tags are present in the editor):</p>
                    <pre><code>// Multiple:
[
  { 
    "nodeID": "ns=2;s=Factory.Line1.Motor1.speed", 
    "value": 42.0, 
    "type": "Float" 
  },
  { 
    "nodeID": "ns=2;s=Factory.Line1.Motor1.state", 
    "value": 1, 
    "type": "Int32" 
  }
]

// Single:
{ 
  "nodeID": "ns=2;s=Factory.Line1.Motor1.speed", 
  "value": 42.0 
}

// Raw Scalar (requires configured tags):
42.0</code></pre>
                    <p><strong>Output (msg.payload):</strong> Array of write results:</p>
                    <pre><code>[
  {
    "name": "speed",
    "nodeID": "ns=2;s=Factory.Line1.Motor1.speed",
    "value": 42.0,
    "type": "Float",
    "status": "Good"
  }
]</code></pre>
                </div>
            </details>

            <!-- Browse Mode -->
            <details class="opcua-help-card">
                <summary><i class="fa fa-sitemap"></i> Browse Mode</summary>
                <div class="opcua-help-content">
                    <p>Browses the children of one or more specified nodes (hierarchical references only).</p>
                    <p><strong>Input (msg.payload):</strong> Pass an array of objects to browse multiple nodes. If <code>[]</code> or left empty, browses starting from the <code>RootFolder</code>:</p>
                    <pre><code>[
  {
    "name": "Factory",
    "nodeID": "ns=2;s=Factory"
  }
]</code></pre>
                    <p><strong>Output (msg.payload):</strong> Array of browse results with their child references:</p>
                    <pre><code>[
  {
    "name": "Factory",
    "nodeID": "ns=2;s=Factory",
    "status": "Good",
    "children": [
      {
        "nodeID": "ns=2;s=Factory.Line1",
        "browseName": "Line1",
        "displayName": "Line1",
        "nodeClass": "Object",
        "typeDefinition": "ns=0;i=58",
        "hasTypeDefinition": {
          "nodeID": "ns=0;i=58",
          "browseName": "FolderType",
          "displayName": "FolderType"
        }
      }
    ]
  }
]</code></pre>
                    <p><strong>Read tag values:</strong> When checked (default), variables under the browsed node will have their <code>value</code> attribute read. If unchecked, the <code>value</code> attribute will be returned as <code>null</code>, which improves browse speed.</p>
                    <p><strong>Overriding via message:</strong> You can dynamically override this option by setting <code>msg.opcua.readValuesRecursive</code> to <code>true</code> or <code>false</code>.</p>
                </div>
            </details>

            <!-- Browse Recursive Mode -->
            <details class="opcua-help-card">
                <summary><i class="fa fa-refresh"></i> Browse Recursive Mode</summary>
                <div class="opcua-help-content">
                    <p>Performs a recursive, hierarchical search of the address space starting from the given nodeId(s).</p>
                    <p><strong>Input (msg.payload):</strong> Pass starting node(s) as an array of objects, or <code>[]</code>/empty to start from the <code>RootFolder</code>:</p>
                    <pre><code>[
  {
    "name": "Factory",
    "nodeID": "ns=2;s=Factory"
  }
]</code></pre>
                    <p><strong>Output (msg.payload):</strong> Array of browse results containing nested children arrays representing the complete sub-tree structure.</p>
                    <p><strong>Read tag values recursively:</strong> When checked (default), variables in the sub-tree will have their <code>value</code> attribute read. If unchecked, the <code>value</code> attribute will be returned as <code>null</code>, which improves browse speed on large address spaces.</p>
                    <p><strong>Overriding via message:</strong> You can dynamically override this option by setting <code>msg.opcua.readValuesRecursive</code> to <code>true</code> or <code>false</code>.</p>
                </div>
            </details>

            <!-- Method Mode -->
            <details class="opcua-help-card">
                <summary><i class="fa fa-cogs"></i> Method Mode</summary>
                <div class="opcua-help-content">
                    <p>Calls one or more OPC UA methods on the server.</p>
                    <p><strong>Input (msg.payload):</strong> Pass an array of method call objects. If empty, uses method items configured in the editor:</p>
                    <pre><code>[
  {
    "name": "CalcSum",
    "nodeID": "ns=2;s=Factory.Line1.CalcSum",
    "objectID": "ns=2;s=Factory.Line1",
    "inputs": [
      { "name": "a", "type": "Float", "value": 10.5 },
      { "name": "b", "type": "Float", "value": 20.0 }
    ]
  }
]</code></pre>
                    <p><strong>Output (msg.payload):</strong> Array of call results containing output arguments:</p>
                    <pre><code>[
  {
    "name": "CalcSum",
    "nodeID": "ns=2;s=Factory.Line1.CalcSum",
    "status": "Good",
    "outputs": [
      {
        "name": "result",
        "type": "Float",
        "value": 30.5
      }
    ]
  }
]</code></pre>
                </div>
            </details>

            <!-- Subscription Mode -->
            <details class="opcua-help-card">
                <summary><i class="fa fa-bell"></i> Subscription Mode</summary>
                <div class="opcua-help-content">
                    <p>Subscribes to one or more variable values and emits downstream messages on value changes.</p>
                    <p><strong>Sub. Mode Options:</strong></p>
                    <ul>
                        <li><code>Append tags (add to list)</code>: Appends new tags to the active subscription. Recreates subscription only if <code>updateRate</code> changes.</li>
                        <li><code>Replace tags (keep only current)</code>: Default. Stops the active subscription and starts a new one with the newly supplied tags.</li>
                    </ul>
                    <p><strong>Overriding via message:</strong> You can dynamically override subscription mode and rates by passing the <code>msg.opcua</code> object:</p>
                    <pre><code>msg.opcua = {
  "subscriptionMode": "append" | "replace" | "clear",
  "updateRate": 500
}</code></pre>
                    <p><em>Note: Passing <code>"clear"</code> in <code>msg.opcua</code>, or sending <code>msg.payload = []</code> or <code>msg.payload = null</code> stops and cancels the active subscription.</em></p>
                    <p><strong>Input (msg.payload):</strong> Pass an array of objects to subscribe to. If not an array, falls back to configured items in the editor.</p>
                    <pre><code>[
  {
    "name": "speed",
    "nodeID": "ns=2;s=Factory.Line1.Motor1.speed"
  }
]</code></pre>
                    <p><strong>Output:</strong> Emits a message downstream whenever a monitored variable's value changes:</p>
                    <pre><code>{
  "topic": "speed",
  "payload": {
    "name": "speed",
    "nodeID": "ns=2;s=Factory.Line1.Motor1.speed",
    "value": 45.2,
    "type": "Float",
    "status": "Good",
    "sourceTimestamp": "2026-06-30T11:30:00.000Z",
    "serverTimestamp": "2026-06-30T11:30:00.000Z"
  },
  "opcua": {
    "mode": "subscription",
    "nodeID": "ns=2;s=Factory.Line1.Motor1.speed",
    "status": "Good"
  }
}</code></pre>
                </div>
            </details>

            <!-- Events Mode -->
            <details class="opcua-help-card">
                <summary><i class="fa fa-envelope-o"></i> Events Mode</summary>
                <div class="opcua-help-content">
                    <p>Subscribes to event notifications on one or more nodes.</p>
                    <p><strong>Sub. Mode Options & Dynamic Overrides:</strong> Supports the same <code>Sub. Mode</code> options, <code>msg.opcua</code> settings, and subscription cancellation logic (sending <code>msg.payload = []</code> or <code>null</code> stops the active event subscription) as Subscription Mode.</p>
                    <p><strong>Input (msg.payload):</strong> Pass an array of node objects to monitor for events.</p>
                    <pre><code>[
  {
    "name": "Server",
    "nodeID": "i=2253"
  }
]</code></pre>
                    <p><strong>Output:</strong> Emits a message downstream when an event is received on the monitored node.</p>
                </div>
            </details>

            <!-- Get Subscription ID Mode -->
            <details class="opcua-help-card">
                <summary><i class="fa fa-hashtag"></i> Get Subscription ID Mode</summary>
                <div class="opcua-help-content">
                    <p>Returns the internal OPC UA subscription ID for debugging or advanced integration.</p>
                    <p><strong>Output (msg.payload):</strong> Returns the internal subscription ID.</p>
                </div>
            </details>

        </details>
    </div>
</script>
